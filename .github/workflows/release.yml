name: release

# 手动触发。每个平台构建完【自己】发布到同一个 Release —— 谁先好谁先上,
# 慢的平台(Windows zip / NSIS)不阻塞快的(mac/Ubuntu)。
# 建 Release 需要 contents:write,token 默认只有读,必须显式声明。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            macSign: true
            paths: "dist/*.dmg dist/*.zip dist/latest*.yml dist/*.blockmap"
          # Linux 的 AppImage 把 blockmap 内嵌,不生成独立 .blockmap 文件,
          # 不能放在 upload glob 里(匹配不到会报 "no matches found")。
          - os: ubuntu-latest
            target: --linux
            macSign: false
            paths: "dist/*.AppImage dist/*.deb dist/latest*.yml"
          # Windows 必须 store(不压缩):7za 压 800MB 要 1 小时+日志崩溃(Invalid string length),
          # mac 用系统原生 zip 所以快。运行时已由 runtime:pack 打成单个 tar.gz,
          # 安装包只复制/归档这一个文件,Windows 打包从 30 分钟降到几分钟。
          # latest.yml 由 nsis job 上传(exe 版清单);zip job 不传,避免互相覆盖。
          - os: windows-latest
            target: --win zip --config.compression=store
            macSign: false
            paths: "dist/*.zip"
    runs-on: ${{ matrix.os }}
    env:
      # 保持 auto-discovery=false:防止捡到 GitHub runner 自带的自签名证书乱签。
      # 配了 CSC_LINK(证书)时,electron-builder 会直接用它签名,与 auto-discovery 无关。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      # 把对话界面文案「探索未至之境」改成「金蝶云星空助手」(覆盖 npm 安装的默认值)。
      - name: Patch runtime i18n
        run: npm run runtime:patch

      # 把 3.3 万个小文件打成单个 tar.gz,安装包只复制一个文件(首次运行才解压)。
      - name: Pack dsh runtime into single archive
        run: npm run runtime:pack

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      - name: Build
        run: |
          ARGS="${{ matrix.target }} --publish never"
          # mac 且已配证书(CSC_LINK)时,顺带启用 Apple 公证(先签名后公证)。
          # 未配置凭据时保持不签名不公证,与现状一致。
          if [ "${{ matrix.macSign == true }}" = "true" ] && [ -n "${{ secrets.CSC_LINK }}" ]; then
            ARGS="$ARGS --config.mac.notarize=true"
          fi
          npx electron-builder $ARGS

      # 本平台发布:幂等(不存在则建 Release,存在则跳过),并发竞争用重试兜底。
      - name: Publish to release (independent per platform)
        shell: bash
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DeepSeek Harness Desktop $TAG" \
              --notes "跨平台 · 零依赖 · 下载即用。捆绑独立 Node.js 运行时与 uv,内置金蝶云星空 MCP。官网:https://wahailong.github.io/dsh-desktop" \
              --target main \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "release create failed"; exit 1; }
          fi
          # --clobber 覆盖同名资产,重复运行幂等
          shopt -s nullglob
          gh release upload "$TAG" ${{ matrix.paths }} --clobber

  # Windows NSIS 安装版:单独 job,独立发布,不阻塞任何人。
  nsis:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      - name: Patch runtime i18n
        run: npm run runtime:patch

      # 同样打包成单个 tar.gz,NSIS 只需归档一个文件,不再 30 分钟。
      - name: Pack dsh runtime into single archive
        run: npm run runtime:pack

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --config.compression=store --publish never

      - name: Publish NSIS exe
        shell: bash
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DeepSeek Harness Desktop $TAG" \
              --notes "跨平台 · 零依赖 · 下载即用。官网:https://wahailong.github.io/dsh-desktop" \
              --target main \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "release create failed"; exit 1; }
          fi
          # 更新清单 latest*.yml + blockmap 一并上传,electron-updater 靠它发现新版本。
          shopt -s nullglob
          gh release upload "$TAG" dist/*.exe dist/latest*.yml dist/*.blockmap --clobber
