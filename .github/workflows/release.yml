name: release

# 手动触发。每个平台构建完【自己】发布到同一个 Release —— 谁先好谁先上,
# 慢的平台(Windows zip / NSIS)不阻塞快的(mac/Ubuntu)。
# 建 Release 需要 contents:write,token 默认只有读,必须显式声明。
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifactName: dsh-desktop-macos
            paths: "dist/*.dmg dist/*.zip"
          - os: ubuntu-latest
            target: --linux
            artifactName: dsh-desktop-ubuntu
            paths: "dist/*.AppImage dist/*.deb"
          # Windows zip 用 store 压缩(纯归档不压缩):800MB 全是预编译二进制,
          # 压无可压,store 只快不亏(几分钟 vs LZMA 1 小时)。
          - os: windows-latest
            target: --win zip --config.compression=store
            artifactName: dsh-desktop-windows-zip
            paths: "dist/*.zip"
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifact (safety cache)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      # 本平台发布:幂等(不存在则建 Release,存在则跳过),并发竞争用重试兜底。
      - name: Publish to release (independent per platform)
        shell: bash
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DeepSeek Harness Desktop $TAG" \
              --notes "跨平台 · 零依赖 · 下载即用。捆绑独立 Node.js 运行时与 uv,内置金蝶云星空 MCP。官网:https://wahailong.github.io/dsh-desktop" \
              --target main \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "release create failed"; exit 1; }
          fi
          # --clobber 覆盖同名资产,重复运行幂等
          gh release upload "$TAG" ${{ matrix.paths }} --clobber

  # Windows NSIS 安装版:单独 job(约 1 小时,LZMA 压 800MB),独立发布,不阻塞任何人。
  nsis:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload NSIS artifact (safety cache)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-nsis
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish NSIS exe
        shell: bash
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DeepSeek Harness Desktop $TAG" \
              --notes "跨平台 · 零依赖 · 下载即用。官网:https://wahailong.github.io/dsh-desktop" \
              --target main \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "release create failed"; exit 1; }
          fi
          gh release upload "$TAG" dist/*.exe --clobber
