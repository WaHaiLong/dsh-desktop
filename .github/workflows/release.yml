name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifactPaths: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            # Windows ZIP is uploaded early by the fast-path step, so the final
            # upload only needs the NSIS .exe here (no duplicate 800MB zip).
            artifactPaths: |
              dist/*.exe
          - os: ubuntu-latest
            artifactPaths: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      # Windows NSIS compresses the ~800MB bundle with LZMA and takes ~1h on the
      # 2-vCPU runner. Build the zip first with "store" compression (pure archive,
      # no deflate/LZMA — the bundle is prebuilt binaries, incompressible anyway)
      # so a Windows download is ready within minutes; NSIS catches up later.
      # Note: a plain `--win zip` with default compression is NOT fast — 7za spent
      # ~61min deflating before crashing the logger with "Invalid string length".
      - name: Build Windows ZIP (fast path)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win zip --config.compression=store --publish never

      - name: Upload Windows ZIP
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --win nsis --publish never
          else
            npm run dist
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: ${{ matrix.artifactPaths }}
          if-no-files-found: ignore
