name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      # Windows NSIS compresses the ~800MB bundle with LZMA and takes ~1h.
      # Build the zip first (fast) and upload it early so a Windows download
      # is available within minutes; the NSIS installer catches up later.
      - name: Build Windows ZIP (fast path)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win zip --publish never

      - name: Upload Windows ZIP
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --win nsis --publish never
          else
            npm run dist
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
