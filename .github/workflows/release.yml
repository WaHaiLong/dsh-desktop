name: release

# 手动触发。每个平台构建完【自己】发布到同一个 Release —— 谁先好谁先上,
# 慢的平台(Windows zip / NSIS)不阻塞快的(mac/Ubuntu)。
# 建 Release 需要 contents:write,token 默认只有读,必须显式声明。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            paths: "dist/*.dmg dist/*.zip"
          - os: ubuntu-latest
            target: --linux
            paths: "dist/*.AppImage dist/*.deb"
          # Windows 必须 store(不压缩):7za 压 800MB 要 1 小时+日志崩溃(Invalid string length),
          # mac 用系统原生 zip 所以快。运行时已由 runtime:pack 打成单个 tar.gz,
          # 安装包只复制/归档这一个文件,Windows 打包从 30 分钟降到几分钟。
          - os: windows-latest
            target: --win zip --config.compression=store
            paths: "dist/*.zip"
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      # 把对话界面文案「探索未至之境」改成「金蝶云星空助手」(覆盖 npm 安装的默认值)。
      - name: Patch runtime i18n
        run: npm run runtime:patch

      # 把 3.3 万个小文件打成单个 tar.gz,安装包只复制一个文件(首次运行才解压)。
      - name: Pack dsh runtime into single archive
        run: npm run runtime:pack

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never

      # 本平台发布:幂等(不存在则建 Release,存在则跳过),并发竞争用重试兜底。
      - name: Publish to release (independent per platform)
        shell: bash
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DeepSeek Harness Desktop $TAG" \
              --notes "跨平台 · 零依赖 · 下载即用。捆绑独立 Node.js 运行时与 uv,内置金蝶云星空 MCP。官网:https://wahailong.github.io/dsh-desktop" \
              --target main \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "release create failed"; exit 1; }
          fi
          # --clobber 覆盖同名资产,重复运行幂等
          gh release upload "$TAG" ${{ matrix.paths }} --clobber

  # Windows NSIS 安装版:单独 job,独立发布,不阻塞任何人。
  nsis:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app devDeps
        run: npm install

      - name: Install dsh runtime
        run: npm run runtime:install

      - name: Patch runtime i18n
        run: npm run runtime:patch

      # 同样打包成单个 tar.gz,NSIS 只需归档一个文件,不再 30 分钟。
      - name: Pack dsh runtime into single archive
        run: npm run runtime:pack

      - name: Fetch standalone Node
        run: npm run fetch:node

      - name: Fetch uv
        run: npm run fetch:uv

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --config.compression=store --publish never

      - name: Publish NSIS exe
        shell: bash
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "DeepSeek Harness Desktop $TAG" \
              --notes "跨平台 · 零依赖 · 下载即用。官网:https://wahailong.github.io/dsh-desktop" \
              --target main \
            || gh release view "$TAG" >/dev/null 2>&1 \
            || { echo "release create failed"; exit 1; }
          fi
          gh release upload "$TAG" dist/*.exe --clobber
